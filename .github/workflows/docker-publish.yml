name: CD back (tests + publication + deploiement)

# Lors d'un push sur main : lance d'abord les tests, et SEULEMENT s'ils passent
# fabrique et publie l'image back sur Docker Hub, puis deploie sur la VM.
# workflow_dispatch permet aussi un declenchement manuel (ex : redeployer apres une modif du front).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1) Garde-fou : compile et lance les tests (unitaires + integration).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: locmns
          POSTGRES_USER: locmns_user
          POSTGRES_PASSWORD: locmns_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U locmns_user -d locmns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compiler et lancer les tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

  # 2) Publication de l'image : ne demarre que si les tests sont verts.
  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/locmns-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/locmns-back:${{ github.sha }}

  # 3) Deploiement sur la VM (runner auto-heberge) : apres la publication de l'image.
  deploy:
    needs: build-push
    runs-on: [self-hosted]
    steps:
      - name: Deployer le stack sur la VM
        run: |
          cd ~/locmns
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
