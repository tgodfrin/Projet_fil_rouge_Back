name: CD back (publication + deploiement)

# Lors d'un push sur main : fabrique et publie l'image back sur Docker Hub,
# puis deploie sur la VM de l'ecole via le runner auto-heberge.
# workflow_dispatch permet aussi un declenchement manuel (ex : redeployer apres une modif du front).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/locmns-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/locmns-back:${{ github.sha }}

  deploy:
    # S'execute apres la publication de l'image, directement sur la VM (runner auto-heberge).
    needs: build-push
    runs-on: [self-hosted]
    steps:
      - name: Deployer le stack sur la VM
        run: |
          cd ~/locmns
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
