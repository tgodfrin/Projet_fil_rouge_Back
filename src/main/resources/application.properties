# Application
spring.application.name=loc-mns-back

# Database
# Valeurs par defaut utilisees en local sans Docker
# En Docker Compose, les variables SPRING_DATASOURCE_* sont injectees via docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/locmns}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:locmns_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:locmns_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# create : recree les tables au demarrage (data.sql s'execute sur base vide)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Server
server.port=8080
# Prefixe commun a toutes les routes (/api/login, /api/equipment/list...).
# Permet au reverse-proxy nginx de distinguer les appels API du reste (SPA Angular) en production.
server.servlet.context-path=/api

# CORS
# Origines autorisees (liste separee par des virgules) — surcharger via CORS_ALLOWED_ORIGINS en production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT
# Cle secrete utilisee pour signer les tokens (HS256)
# A remplacer en production via la variable d'environnement JWT_SECRET
jwt.secret=${JWT_SECRET:azerty-locmns-secret-key-for-jwt-signing}
# Duree de validite du token : 86400000 ms = 24 heures
jwt.expiration=86400000

# Mail SMTP
# Valeurs par defaut pour Gmail — surcharger via variables d'environnement en production
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:locmns.noreply@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeouts SMTP (ms) — evite de bloquer l'app en local si le serveur mail est inaccessible
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
