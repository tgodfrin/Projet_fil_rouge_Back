# Configuration des tests (src/test/resources).
# Les tests d'intégration (*IT) tournent sur le PostgreSQL réel, comme en dev :
# Hibernate recrée le schéma (ddl-auto=create) puis data.sql réinjecte le jeu de
# données. Démarrer la base (docker compose up) avant `mvn verify`.
# Les tests unitaires (*Test) n'utilisent pas cette config : ils ne chargent pas Spring.

spring.application.name=loc-mns-back

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/locmns}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:locmns_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:locmns_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET:azerty-locmns-secret-key-for-jwt-signing}
jwt.expiration=86400000

# Hôte mail factice : le bean JavaMailSender se construit, aucun envoi réel en test.
spring.mail.host=localhost
spring.mail.port=3025
