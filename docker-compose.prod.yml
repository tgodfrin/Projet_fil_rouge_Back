# Compose de PRODUCTION (VM ecole).
# Les images sont tirees de Docker Hub (pas de build ici) : ${DOCKERHUB_USERNAME}/locmns-back et locmns-front.
# Seul le front (nginx) expose un port public (80) ; back et postgres restent sur le reseau interne.
# Variables fournies par un fichier .env a cote (jamais commite) — voir .env.example.

services:

  # ── Base de donnees PostgreSQL (non exposee publiquement) ──
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Back Spring Boot (non expose : joignable via nginx sur le reseau interne) ──
  back:
    image: ${DOCKERHUB_USERNAME}/locmns-back:latest
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET:                 ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS}
      MAIL_USERNAME:              ${MAIL_USERNAME}
      MAIL_PASSWORD:              ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Front Angular servi par nginx (seul point d'entree public) ──
  front:
    image: ${DOCKERHUB_USERNAME}/locmns-front:latest
    ports:
      - "80:80"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  pgdata:
